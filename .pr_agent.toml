# PR-Agent configuration, run as a GitHub Action (.github/workflows/pr-agent.yml).
# Read from the default branch, so edits take effect once merged to main.
# Docs: https://github.com/The-PR-Agent/pr-agent/blob/main/pr_agent/settings/configuration.toml
#
# Stacked on top of: GitHub Actions CI (.github/workflows/ci.yml),
# GitGuardian, and on-demand code-reviewer subagents.

[config]
# Routed through OpenRouter (the workflow passes the OPENROUTER_KEY secret as OPENROUTER_API_KEY).
# Free (:free) models: no credits needed, but the account is capped at 50 free requests/day
# (a PR costs ~2-6) and free endpoints may log prompts (acceptable: this repo is public).
# The fallback covers rate limits, outages or unparseable answers from the primary.
# Not inkling:free: OpenRouter gates it to agentic harnesses (403 for PR-Agent).
model = "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
fallback_models = ["openrouter/minimax/minimax-m3.1-flash:free"]
# OpenRouter-prefixed ids are not in PR-Agent's token table; pin the context size
# OpenRouter reports for both models (1M) so lookup never fails.
custom_model_max_tokens = 1000000
# PR-Agent's default max_model_tokens (32000) clips large diffs and drops whole files from
# the review (#73 lost its tests). Free models are not billed per token; the cost is runtime.
max_model_tokens = 200000
# Verbose 0 = terse output. We prefer concise PR comments.
verbosity_level = 0
# Publish reviews as PR comments (default).
publish_output = true
# Skip the marketing footer PR-Agent appends to every comment.
ai_disclaimer_title = ""
ai_disclaimer = ""
# Skip PR-Agent on release PRs — they're pure version bumps (Cargo.toml +
# Cargo.lock + tauri.conf.json), so a code review burns a paid credit for
# zero signal. Belt-and-braces: match both the branch convention and the
# commit/PR title convention. Both keys accept regex patterns and MUST
# live under [config] — under [github_app] they are silently ignored.
# Docs: https://docs.qodo.ai/code-review/concepts/ignore-content-from-analysis
ignore_pr_source_branches = ["chore/release-.*", "release/.*"]
ignore_pr_title = ["^chore: release", "^chore\\(release\\)"]

[pr_reviewer]
# Auto-review when a PR is opened or marked ready for review.
require_score_review = true
require_tests_review = true
require_estimate_effort_to_review = true
require_can_be_split_review = true
require_security_review = true
# Don't auto-add labels (we manage them manually).
enable_review_labels_security = false
enable_review_labels_effort = false
# Focus the review checklist on what actually matters here.
extra_instructions = """
What this repo is:
AppLogsViewer, a desktop app that streams live Android (`adb logcat`) and iOS (`idevicesyslog`)
device logs into one viewer, and also opens saved log files (.logcat, .txt, .csv, .json). The
log lines are device-controlled, untrusted input.

Layout:
- src-tauri/: Rust 2021, single-binary Tauri v2 host. bridge/android.rs + bridge/ios.rs run the
  bundled tools and parse lines (parser.rs), ws_server.rs streams them over WebSocket (:8765
  Android, :8766 iOS), http_server.rs serves the viewer on :8780. Bundled adb + libimobiledevice
  (staged at build time by src-tauri/scripts/bundle-tooling-*, located by tooling.rs): never add a runtime
  dependency on these from the system PATH.
- viewer/applogs-viewer.html: the page, embedded with include_str! (http_server.rs).
- viewer/assets/{css,js,fonts,icons}: embedded with include_bytes! through the FILES table in
  src-tauri/src/viewer_assets.rs. A new or renamed asset needs its FILES line; the
  assets_match_disk test fails otherwise. Fonts are pinned by viewer/assets/fonts/SHA256SUMS.
- viewer/assets/js/*.js are classic scripts (not ES modules) that register on the global `ALV`
  namespace: dom.js (DOM builders), ui.js (toasts, menus, popovers, tooltips, dialogs), keys.js
  (shortcut registry, Esc stack), prefs.js (settings store), session.js (pure per-session view
  state), grid.js (log grid), live.js (toolbar, status bar), shell.js (app shell, sidebar).
- tests/viewer/*.test.mjs: zero-dependency tests run with `node --test` (Node 22) in CI. They
  include static lints of the page and assets (HTML structure, id and handler contracts, XSS).
- No npm, no package.json, no bundler or build step, no CDN: the app runs offline from
  embedded files. cargo fmt + clippy + tests run in CI (.github/workflows/ci.yml).

Security model (check before flagging):
- Untrusted text reaches the DOM only as text. dom.js `el()` sets text via textContent or text
  nodes and throws on HTML props; ui.js toasts and menus set title and desc via textContent;
  log rows are built from text nodes. Before flagging XSS, find the sink in the code; do not
  guess at code that is not in the diff. innerHTML may only be assigned '' (static.test.mjs
  lints this).
- CSP lives in src-tauri/tauri.conf.json (app.security.csp). Network binds are 127.0.0.1 only,
  and ws_server.rs keeps an Origin allowlist (localhost/127.0.0.1:8780).

Flag with HIGH severity:
- Any non-loopback bind, broadened Origin/CORS allowlist, or loosened or removed CSP.
- Subprocess args built from user input without validation (UDID, search query, etc.).
- innerHTML / outerHTML / insertAdjacentHTML / document.write with non-empty content.
- New npm dependency, package.json, bundler, CDN script or remote font/stylesheet.
- A viewer asset added or renamed without its viewer_assets.rs FILES entry.
- Reintroduced LogStore writes without consumers: H8 removed that, do not bring it back.
- Blocking I/O inside async (std::process::Command::output, fs reads) outside spawn_blocking.
- Comment rot: references to deleted files (launcher.py, ios_bridge.py, search_shim.js, store.rs).

Skip nitpicks on: doc comments, README copy edits, formatting (cargo fmt CI), and micro-costs
such as one or two DOM lookups per key press.
"""

[pr_description]
publish_description_as_comment = false
add_original_user_description = true
keep_original_user_title = true
generate_ai_title = false
extra_instructions = """
PR descriptions in this repo use these ## headings, in this order. Skip a heading only when it
does not apply (Fix is for bug fixes only). Keep them terse.
- Summary: 1-2 lines, what changed and why.
- What changed: bullets, by key file or module.
- Problem / feature: the bug being fixed or the feature delivered.
- Fix: bugs only; the root cause and how it was fixed.
- Test plan: a [ ] checklist, manual and automated.
- Deployment steps: migrations, env vars, secrets, restarts; "None" if pure code.
- Verification: typecheck / lint / test status.
Don't rewrite well-formed descriptions. Only fill in missing sections.
"""

[pr_code_suggestions]
# Suggestions are valuable but never auto-applied here.
commitable_code_suggestions = false
num_code_suggestions_per_chunk = 3
extra_instructions = """
Prefer suggestions that:
- Tighten security boundaries (validation, allowlist, CSP).
- Remove dead code or stale doc comments.
- Replace blocking calls inside async with spawn_blocking.
- Add ring-buffer caps on unbounded in-memory growth.

Avoid suggestions that:
- Reintroduce the native-search path (search_shim, /search route, store::search/scan).
- Loosen CORS, Origin, or CSP allowlists.
- Replace cargo fmt-blessed formatting with stylistic alternatives.
- Add npm packages, a bundler, ES-module conversions or CDN assets to the viewer.
- Swap textContent / dom.el() text for innerHTML or template-string markup.
"""

[ignore]
# Don't burn tokens reviewing build outputs, vendored binaries, or generated bindings.
# Cargo.lock is intentionally NOT ignored — committed lockfile + no dependency-audit
# step in CI means we want PR-Agent to flag unexpected resolution shifts.
glob = [
  "src-tauri/target/**",
  "src-tauri/vendor/**",
  "src-tauri/gen/**",
  "src-tauri/icons/**",
  "**/*.png",
  "**/*.ico",
  "**/*.icns",
  "**/*.dmg",
  "**/*.exe",
]

[github_app]
# Auto-actions on PR events. Add 'review' so every PR gets one without manual /review.
pr_commands = [
  "/describe",
  "/review",
]
# Run /improve only on demand (cost-conscious; we already have CI + Claude reviewers).
push_commands = []
