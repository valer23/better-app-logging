name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  stale-refs:
    name: Stale-ref grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # -I skips binary files: viewer/assets/fonts/*.woff2 (P1b) could match a pattern by chance.
      - name: No dangling Python-bridge refs
        run: |
          if grep -rnI --exclude-dir=target "launcher\.py\|ios_bridge\.py\|adb_bridge\.py" src-tauri/src/ viewer/; then
            echo "::error::Found dangling Python-bridge references"
            exit 1
          fi

      - name: No dead native-search refs
        run: |
          if grep -rnI --exclude-dir=target "search_shim\|SearchMode\|aho_corasick\|NATIVE_THRESHOLD" src-tauri/src/ src-tauri/Cargo.toml viewer/ src-tauri/README.md; then
            echo "::error::Found dead native-search references"
            exit 1
          fi

  # Zero-dependency checks of the viewer page and its assets (tests/viewer/*.test.mjs): HTML
  # structure, inline script syntax, the element id and handler contracts, the XSS and drag-band
  # lints, and asset references. Replaces the Python HTML parse, which accepted mis-nested tags.
  # Later PRs extend this job (offline lints, CSS layering, settings store, legacy parsers).
  viewer:
    name: Viewer static checks + unit tests (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node --test
        run: node --test "tests/viewer/*.test.mjs"

  rust:
    name: cargo fmt + check + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # children.rs's Job Object code and its test are cfg(windows): the ubuntu
  # job never compiles them and release.yml builds Windows only on tags or
  # manual dispatch, in release mode, without clippy or tests, so a
  # Windows-only break would otherwise first surface at release time.
  rust-windows:
    name: cargo check + clippy + test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri.windows.conf.json bundles vendor/windows-x86_64/*, and
      # tauri-build fails when that glob matches nothing. CI only compiles,
      # so a placeholder stands in for the tooling bundle-tooling-windows.ps1
      # downloads for releases (vendor/ is gitignored).
      - name: Placeholder for bundled tooling
        working-directory: src-tauri
        shell: bash
        run: |
          mkdir -p vendor/windows-x86_64
          printf 'placeholder\n' > vendor/windows-x86_64/README.txt

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
